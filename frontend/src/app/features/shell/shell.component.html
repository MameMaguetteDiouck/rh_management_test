<div class="flex h-screen bg-white">
  @if (sidebarOpen()) {
    <div
      (click)="closeSidebar()"
      class="fixed inset-0 z-20 bg-slate-900/40 md:hidden"
    ></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-30 flex w-64 flex-col border-r border-slate-200 bg-white transition-transform duration-200 md:static md:z-auto md:translate-x-0 md:transition-[width]"
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.md:w-16]="!sidebarOpen()"
  >
    <div
      class="flex h-16 items-center border-b border-slate-100 px-3"
      [class.justify-between]="sidebarOpen()"
      [class.justify-center]="!sidebarOpen()"
    >
      @if (sidebarOpen()) {
        <img src="branding/logo_old.png" alt="RH Perspectives" class="h-8 w-auto" />
      }
      <button
        type="button"
        (click)="toggleSidebar()"
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-slate-500 transition-colors hover:bg-slate-100"
        [attr.aria-label]="sidebarOpen() ? 'Réduire la navigation' : 'Ouvrir la navigation'"
      >
        <app-icon [name]="sidebarOpen() ? 'chevron-left' : 'menu'" class="h-5 w-5" />
      </button>
    </div>

    <nav class="flex-1 space-y-1 px-3 py-4">
      @if (sidebarOpen()) {
        <p class="px-2.5 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Navigation</p>
      }
      @if (isAdmin()) {
        <a
          routerLink="/admin"
          routerLinkActive="bg-brand-600 text-white shadow-sm hover:bg-brand-600"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onNavLinkClick()"
          class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100"
        >
          <app-icon name="shield" class="h-5 w-5 shrink-0" />
          @if (sidebarOpen()) {
            <span>Dashboard</span>
          }
        </a>
        <a
          routerLink="/admin/users"
          routerLinkActive="bg-brand-600 text-white shadow-sm hover:bg-brand-600"
          (click)="onNavLinkClick()"
          class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100"
        >
          <app-icon name="user" class="h-5 w-5 shrink-0" />
          @if (sidebarOpen()) {
            <span>Users</span>
          }
        </a>
      }
      <a
        routerLink="/tasks"
        routerLinkActive="bg-brand-600 text-white shadow-sm hover:bg-brand-600"
        (click)="onNavLinkClick()"
        class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100"
      >
        <app-icon name="tasks" class="h-5 w-5 shrink-0" />
        @if (sidebarOpen()) {
          <span>Tâches</span>
        }
      </a>
    </nav>

    @if (currentUser(); as user) {
      <div class="relative border-t border-slate-100 p-2" data-user-menu>
        @if (menuOpen()) {
          <div
            class="absolute bottom-full left-2 right-2 z-10 mb-2 min-w-[11rem] rounded-lg border border-slate-200 bg-white py-1 shadow-lg"
          >
            <a
              routerLink="/account"
              (click)="closeMenu()"
              class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50"
            >
              <app-icon name="user" class="h-4 w-4" />
              Profil
            </a>
            <button
              type="button"
              (click)="logout()"
              class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-red-600 hover:bg-red-50"
            >
              <app-icon name="logout" class="h-4 w-4" />
              Déconnexion
            </button>
          </div>
        }
        <button
          type="button"
          (click)="toggleMenu()"
          class="flex w-full items-center gap-2 rounded-md p-1.5 hover:bg-slate-100"
        >
          <span
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-linear-to-br from-brand-500 to-brand-700 text-sm font-semibold text-white shadow-sm"
          >
            {{ initials() }}
          </span>
          @if (sidebarOpen()) {
            <span class="min-w-0 flex-1 text-left leading-tight">
              <span class="block truncate text-sm font-medium text-slate-900">{{ user.firstName }} {{ user.lastName }}</span>
              <span class="mt-0.5 inline-block truncate rounded-full bg-brand-50 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide text-brand-700">
                {{ roleLabel() }}
              </span>
            </span>
            <app-icon name="chevron-down" class="h-4 w-4 shrink-0 text-slate-400" />
          }
        </button>
      </div>
    }
  </aside>

  <main
    #mainEl
    (scroll)="onMainScroll()"
    class="flex-1 overflow-y-auto bg-linear-to-br from-white via-brand-50/50 to-white p-6"
  >
    @if (!sidebarOpen()) {
      <button
        type="button"
        (click)="toggleSidebar()"
        aria-label="Ouvrir la navigation"
        class="mb-4 flex h-9 w-9 items-center justify-center rounded-md border border-slate-200 bg-white text-slate-500 shadow-sm hover:bg-slate-100 md:hidden"
      >
        <app-icon name="menu" class="h-5 w-5" />
      </button>
    }
    <router-outlet />
  </main>

  <button
    type="button"
    (click)="scrollToggle()"
    [attr.aria-label]="atBottom() ? 'Remonter en haut' : 'Descendre en bas'"
    class="fixed bottom-6 right-6 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-brand-600 text-white shadow-lg transition-colors hover:bg-brand-700"
  >
    <app-icon [name]="atBottom() ? 'chevron-up' : 'chevron-down'" class="h-5 w-5" />
  </button>
</div>
