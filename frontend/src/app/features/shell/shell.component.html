<div class="flex h-screen bg-slate-50">
  <aside
    class="flex flex-col border-r border-slate-200 bg-white transition-[width] duration-200"
    [class.w-64]="sidebarOpen()"
    [class.w-16]="!sidebarOpen()"
  >
    <div class="flex h-14 items-center justify-between border-b border-slate-100 px-3">
      @if (sidebarOpen()) {
        <span class="truncate text-base font-semibold text-brand-700">RH Perspectives</span>
      }
      <button
        type="button"
        (click)="toggleSidebar()"
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-slate-500 hover:bg-slate-100"
        [attr.aria-label]="sidebarOpen() ? 'Réduire la navigation' : 'Ouvrir la navigation'"
      >
        <app-icon [name]="sidebarOpen() ? 'chevron-left' : 'menu'" class="h-5 w-5" />
      </button>
    </div>

    <nav class="flex-1 space-y-1 px-2 py-3">
      @if (isAdmin()) {
        <a
          routerLink="/admin"
          routerLinkActive="bg-brand-50 text-brand-700"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-md px-2.5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          <app-icon name="shield" class="h-5 w-5" />
          @if (sidebarOpen()) {
            <span>Dashboard</span>
          }
        </a>
        <a
          routerLink="/admin/users"
          routerLinkActive="bg-brand-50 text-brand-700"
          class="flex items-center gap-3 rounded-md px-2.5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          <app-icon name="user" class="h-5 w-5" />
          @if (sidebarOpen()) {
            <span>Users</span>
          }
        </a>
      }
      <a
        routerLink="/tasks"
        routerLinkActive="bg-brand-50 text-brand-700"
        class="flex items-center gap-3 rounded-md px-2.5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
      >
        <app-icon name="tasks" class="h-5 w-5" />
        @if (sidebarOpen()) {
          <span>Tâches</span>
        }
      </a>
    </nav>

    @if (currentUser(); as user) {
      <div class="relative border-t border-slate-100 p-2" data-user-menu>
        @if (menuOpen()) {
          <div
            class="absolute bottom-full left-2 right-2 z-10 mb-2 min-w-[11rem] rounded-lg border border-slate-200 bg-white py-1 shadow-lg"
          >
            <a
              routerLink="/account"
              (click)="closeMenu()"
              class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50"
            >
              <app-icon name="user" class="h-4 w-4" />
              Profil
            </a>
            <button
              type="button"
              (click)="logout()"
              class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-red-600 hover:bg-red-50"
            >
              <app-icon name="logout" class="h-4 w-4" />
              Déconnexion
            </button>
          </div>
        }
        <button
          type="button"
          (click)="toggleMenu()"
          class="flex w-full items-center gap-2 rounded-md p-1.5 hover:bg-slate-100"
        >
          <span
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand-100 text-sm font-semibold text-brand-700"
          >
            {{ initials() }}
          </span>
          @if (sidebarOpen()) {
            <span class="min-w-0 flex-1 text-left leading-tight">
              <span class="block truncate text-sm font-medium text-slate-900">{{ user.firstName }} {{ user.lastName }}</span>
              <span class="block truncate text-xs text-slate-500">{{ roleLabel() }}</span>
            </span>
            <app-icon name="chevron-down" class="h-4 w-4 text-slate-400" />
          }
        </button>
      </div>
    }
  </aside>

  <main class="flex-1 overflow-y-auto p-6">
    <router-outlet />
  </main>
</div>
