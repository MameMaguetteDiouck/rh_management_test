<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-6">
        <span class="text-base font-semibold text-brand-700">RH Perspectives</span>

        <nav class="flex items-center gap-1">
          <a
            routerLink="/tasks"
            routerLinkActive="bg-brand-50 text-brand-700"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
          >
            Tâches
          </a>
          @if (isAdmin()) {
            <a
              routerLink="/admin"
              routerLinkActive="bg-brand-50 text-brand-700"
              class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
            >
              Administration
            </a>
          }
        </nav>
      </div>

      @if (currentUser(); as user) {
        <div class="flex items-center gap-3">
          <div class="text-right leading-tight">
            <p class="text-sm font-medium text-slate-900">{{ user.firstName }} {{ user.lastName }}</p>
            <p class="text-xs text-slate-500">{{ roleLabel() }}</p>
          </div>
          <button
            type="button"
            (click)="logout()"
            class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
          >
            Déconnexion
          </button>
        </div>
      }
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <router-outlet />
  </main>
</div>
