<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4">
  <form [formGroup]="form" (ngSubmit)="submit()" class="w-full max-w-sm space-y-4 rounded-xl bg-white p-6 shadow-sm">
    <h1 class="text-xl font-semibold text-slate-900">Connexion</h1>

    <div class="space-y-1">
      <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
      />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <p class="text-sm text-red-600">Email invalide.</p>
      }
    </div>

    <div class="space-y-1">
      <label for="password" class="block text-sm font-medium text-slate-700">Mot de passe</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <p class="text-sm text-red-600">Mot de passe requis.</p>
      }
    </div>

    @if (errorMessage()) {
      <p role="alert" class="text-sm text-red-600">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-brand-700 disabled:opacity-50"
    >
      {{ submitting() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</div>
